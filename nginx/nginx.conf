upstream contract_backend {
    server backend:8000;
}

upstream contract_frontend {
    server frontend:8081;
}

# Preserve HTTPS information supplied by the host-level reverse proxy. Fall
# back to the direct connection values for local Docker testing.
map $http_x_forwarded_proto $contract_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_port $contract_forwarded_port {
    default $http_x_forwarded_port;
    ""      $server_port;
}

# API virtual host. The DevOps TLS proxy must preserve the original Host
# header, so every path on cmapi-dev is handled by Django.
server {
    listen 81;
    server_name cmapi-dev.svuonline.edu.sy cmapi.localhost;

    client_max_body_size 20M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Permissions-Policy;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://contract_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $contract_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $contract_forwarded_port;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}

